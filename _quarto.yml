project:
  type: book
  render:
    - "*.qmd"
    - "!archive/"

book:
  output-file: "Supplementary-file-S1"
  title: "Krill oil does not improve glucose tolerance during resistance training but slightly lowers metabolic syndrome burden in sedentary adults: a double-blind, randomized controlled trial"
  # Each affiliation is defined (with an `id`) the first time it is used and
  # referred to with `ref` for later authors. Affiliations are numbered in
  # order of first appearance.
  author:
    - name: Håvard Hamarsland
      email: havard.hamarsland@inn.no
      corresponding: false
      # Marked with a dagger and "These authors contributed equally"
      equal-contributor: true
      affiliations:
        - id: inn
          name: University of Inland Norway
          department: Section for Health and Exercise Physiology
          city: Lillehammer
          country: Norway
    - name: Magnus Husøy
      equal-contributor: true
      affiliations:
        - ref: inn
        - id: aff2
          name: Laboratory of Medical Biochemistry, Innlandet Hospital Trust
          city: Lillehammer
          country: Norway
    - name: Håvard Nygaard
      affiliations:
        - ref: inn
    - name: Solveig Vuilliomenet
      affiliations:
        - ref: inn
    - name: Jørn K. Thorgersen
      affiliations:
        - ref: inn
    - name: Even H. Rosenlund
      affiliations:
        - ref: inn
    - name: Emilie S. Larsen
      affiliations:
        - ref: inn
    - name: Øistein Hovde
      affiliations:
        - id: aff3
          name: Innlandet Hospital Trust
          city: Brumunddal
          country: Norway
    - name: Daniel Hammarström
      email: daniel.hammarstrom@inn.no
      corresponding: false
      affiliations:
        - ref: inn
    - name: Stian Ellefsen
      email: stian.ellefsen@inn.no
      corresponding: true
      affiliations:
        - ref: inn
        - ref: aff3
  date: today
  date-format: "D MMMM YYYY"   # 20 October 2026
  chapters:
    - index.qmd
    - 01-data.qmd
    - 02-fa.qmd
    - 03-metsyn-intro.qmd
    - 04-metsyn-models.qmd
    - 05-metsyn-postpred.qmd
    - 06-metsyn-simulations.qmd
    - 07-metsyn-inference.qmd
    - 08-metsyn-sensitivity.qmd
    - 09-ogtt.qmd
    - 10-results.qmd

# Re-run a chapter's code only when its .qmd has changed; results are stored
# in _freeze/. Changes to sourced scripts or data are not detected.
execute:
  freeze: auto

# Render figures with ragg (better anti-aliasing and fonts than the default
# png device). The file format is set by fig-format under format: typst.
knitr:
  opts_chunk:
    dev: ragg_png

bibliography: resources/bibliography.bib
csl: resources/vancouver.csl
format:
  typst:
    # Raster figures: the default (svg) embeds every drawn element, and
    # posterior predictive plots with many draws reach 15-35 MB each.
    fig-format: png
    fig-dpi: 300
    # Text width of the orange-book template (A4, 3 cm side margins) is
    # 15 cm = 5.9 in. Wider figures are scaled down, shrinking their text.
    fig-width: 5.9
    fig-height: 4
    # Adds authors and affiliations on the page after the cover
    template-partials:
      - resources/typst-show.typ